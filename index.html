<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — Patterns</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
  .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c12 { grid-column: span 12; }
  @media (max-width: 960px) { .c4, .c5, .c7, .c6 { grid-column: span 12; } }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .li:first-of-type { border-top: 0; }
  .li:hover .t { text-decoration: underline; }
  .li .t { font-weight: 600; font-size: 14.5px; }
  .li .r { margin-left: auto; }
  .due-n { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day { border: var(--b); padding: 10px; min-height: 108px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; background: var(--surface); }
  .day .n { font: 700 11px var(--f-mono); text-transform: uppercase; color: var(--muted); }
  .day.today { background: var(--yellow-l); box-shadow: var(--sh-sm); }
  .day.done { background: var(--green-l); }
  .day.mock { border-style: dashed; }
  .day b { font: 600 13px/1.3 var(--f-head); }
  @media (max-width: 960px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cal { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 8px; }
  .cal i { aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--bg-2); }
  .cal i.on { background: var(--green); }
  .stat-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; margin-bottom: 14px; }
  .stat-row .meter { grid-column: 1 / -1; }
  .stat-row b { font: 700 15px var(--f-head); }
  .onboard { padding: 26px; background: var(--yellow-l); border: var(--b3); }
  .onboard h2 { font: 800 26px var(--f-display); text-transform: uppercase; margin-bottom: 6px; }
  .plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
  .plans label { border: var(--b); background: var(--surface); padding: 12px; cursor: pointer; display: block; position: relative; }
  .plans label:has(input:checked) { background: var(--yellow); color: #000; box-shadow: var(--sh-sm); }
  .plans input { position: absolute; opacity: 0; }
  .plans b { display: block; font: 700 15px var(--f-head); } .plans span { font-size: 13px; }
  @media (max-width: 760px) { .plans { grid-template-columns: 1fr 1fr; } }
</style>
<script src="data/catalog.js"></script>
<script src="data/index.js"></script>
<script src="assets/app.js"></script>
<script src="data/roadmap.js"></script>
</head>
<body data-page="home">
<main class="wrap">
  <div id="demo"></div>
  <div class="ph row" style="justify-content:space-between;align-items:end">
    <div><h1 id="hello">Today</h1><p id="sub"></p></div>
    <div class="row" id="topBtns"></div>
  </div>
  <div id="onboard"></div>
  <div class="dash" id="dash"></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = (s) => document.querySelector(s);
  const plan = Store.get("plan"), oa = Store.get("oaDate");

  if (isDemo()) $("#demo").innerHTML = `<div class="callout" style="margin-top:20px">${ICON.info}<p class="grow">You're looking at <b>sample progress</b> so you can see how the dashboard fills in. Your own progress replaces it once you start.</p><button class="btn sm" id="fresh">Start fresh</button></div>`;
  const fresh = $("#fresh"); if (fresh) fresh.onclick = () => { clearDemo(); location.reload(); };

  /* header */
  const h = new Date().getHours();
  $("#hello").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const dayN = planDay(), planDays = plan ? buildPlan(plan) : null;
  $("#sub").innerHTML = oa != null
    ? `Your OA is in <b>${daysFromNow(oa)} days</b>${plan && dayN ? ` · ${PLANS[plan].label} plan · day ${Math.min(dayN, planDays.length)} of ${planDays.length}` : ""}.`
    : "Set your OA date to get a day-by-day plan.";
  const due = SRS.due();
  $("#topBtns").innerHTML = `<a class="btn ${due.length ? "primary" : ""}" href="revise.html">${ICON.cards} Revise${due.length ? ` (${due.length} due)` : ""}</a><a class="btn" href="practice.html">${ICON.target} Practice</a>`;

  /* first visit: set an OA date and plan */
  if (oa == null) {
    $("#onboard").innerHTML = `<div class="onboard" style="margin-bottom:22px"><h2>Let's plan your prep</h2><p class="muted">Pick when your OA is and how long you have. You'll get a day-by-day plan, and revision gets scheduled for you.</p>
      <div class="plans">${Object.entries(PLANS).map(([k, p]) => `<label><input type="radio" name="plan" value="${k}" ${k === "2w" ? "checked" : ""}><b>${p.label}</b><span class="muted">${p.blurb}</span></label>`).join("")}</div>
      <div class="row"><label class="row small">OA date <input class="input" type="date" id="oaIn"></label><button class="btn primary" id="go">Build my plan ${ICON.arrow}</button><a class="btn ghost" href="learn.html">Skip, just browse patterns</a></div></div>`;
    $("#go").onclick = () => {
      const k = document.querySelector("input[name=plan]:checked").value, v = $("#oaIn").value;
      const oaDay = v ? Math.floor(new Date(v + "T12:00").getTime() / 864e5) : today() + PLANS[k].days;
      Store.set("plan", k); Store.set("oaDate", oaDay); Store.set("planStart", today()); location.reload();
    };
  }

  /* cards */
  const P = (id) => patternOf(id), sw = (id) => `<span class="sw" style="background:var(--${groupOf(P(id).group).color})"></span>`;
  const unsolved = PROBLEMS.filter((p) => !Progress.prob(p.id) || Progress.prob(p.id).s !== "solved");
  const hsh = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, today());
  const todays = []; unsolved.slice().sort((a, b) => hsh(a.id) - hsh(b.id)).forEach((p) => { if (todays.length < 3 && !todays.some((t) => t.pat === p.pat)) todays.push(p); });
  const last = P(Store.get("last", "two-pointers"));
  const weak = [
    ...CATALOG.filter((p) => Progress.status(p.id) === 3).map((p) => ({ href: patternUrl(p.id), t: p.title, why: "You marked it “Revise”", id: p.id })),
    ...PROBLEMS.filter((p) => Progress.prob(p.id)?.s === "attempted").map((p) => ({ href: problemUrl(p), t: p.title, why: "Attempted, not solved", id: p.pat }))
  ].slice(0, 5);
  const learned = CATALOG.filter((p) => Progress.status(p.id) === 2).length;
  const solved = PROBLEMS.filter((p) => Progress.prob(p.id)?.s === "solved").length;
  const mocks = Store.get("mocks", []);
  const best = mocks.length ? Math.max(...mocks.map((m) => m.score)) : null;
  const days = new Set(Store.get("days", []));

  let week = "";
  if (planDays && dayN) {
    const d0 = Math.max(1, dayN - ((dayN - 1) % 7));
    week = planDays.slice(d0 - 1, d0 + 6).map((x) => `<a class="day ${x.d === dayN ? "today" : ""} ${x.d < dayN ? "done" : ""} ${x.type === "mock" ? "mock" : ""}" href="${x.type === "mock" ? "mock.html" : x.type === "review" ? "revise.html" : patternUrl(x.pats[0])}" style="text-decoration:none">
      <span class="n">Day ${x.d}${x.d === dayN ? " · today" : ""}</span><b>${x.title}</b><span class="muted">${x.note}</span></a>`).join("");
  }

  $("#dash").innerHTML = `
    <section class="card c4"><div class="card-h"><h3>Due for revision</h3><a class="small" href="revise.html">All</a></div>
      <div class="due-n"><span class="big-n">${due.length}</span><span class="muted">pattern${due.length === 1 ? "" : "s"} today</span></div>
      ${due.length ? due.slice(0, 4).map((p) => `<a class="li" href="revise.html">${sw(p.id)}<span class="t">${p.title}</span><span class="r tag">${SRS.get(p.id).due < today() ? "overdue" : "today"}</span></a>`).join("") + `<a class="btn primary" style="width:100%;margin-top:12px" href="revise.html">Start revision ${ICON.arrow}</a>`
        : `<div class="empty">Nothing due. ${SRS.upcoming(1).length ? `Next: ${SRS.upcoming(1)[0].title} in ${daysFromNow(SRS.get(SRS.upcoming(1)[0].id).due)} days.` : "Mark a pattern “Learned” to schedule it."}</div>`}
    </section>

    <section class="card c4"><div class="card-h"><h3>Today's practice</h3><span class="tag">pattern hidden</span></div>
      ${todays.map((p) => `<a class="li" href="${problemUrl(p)}"><span class="tag ${p.d.toLowerCase()}">${p.d}</span><span class="t">${p.title}</span><span class="r muted small">Solve →</span></a>`).join("")}
      <a class="btn" style="width:100%;margin-top:12px" href="practice.html">More practice ${ICON.arrow}</a>
    </section>

    <section class="card c4"><div class="card-h"><h3>Continue learning</h3></div>
      <div class="row" style="margin-bottom:6px">${sw(last.id)}<span class="lab">${groupOf(last.group).name}</span></div>
      <h3 style="font-size:21px;margin-bottom:4px">${last.title}</h3>
      <p class="muted small">${last.sub}</p>
      <span class="status ${STATUS_CLS[Progress.status(last.id)]}">${STATUS[Progress.status(last.id)]}</span>
      <a class="btn yellow" style="width:100%;margin-top:16px" href="${patternUrl(last.id)}">Open pattern ${ICON.arrow}</a>
    </section>

    ${week ? `<section class="c12"><div class="card-h" style="margin:8px 0 10px"><h3 style="font-size:19px">This week's plan</h3><a class="small" href="roadmap.html">Full roadmap</a></div><div class="week">${week}</div></section>` : ""}

    <section class="card c7"><div class="card-h"><h3>Weak spots</h3><span class="muted small">fix these first</span></div>
      ${weak.length ? weak.map((w) => `<a class="li" href="${w.href}">${sw(w.id)}<span class="t">${w.t}</span><span class="r muted small">${w.why}</span></a>`).join("") : `<div class="empty">No weak spots yet. They show up when you mark a pattern “Revise” or leave a problem unsolved.</div>`}
    </section>

    <section class="card c5"><div class="card-h"><h3>Progress</h3></div>
      <div class="stat-row"><span>Patterns learned</span><b>${learned} / ${CATALOG.length}</b><div class="meter"><i style="width:${learned / CATALOG.length * 100}%"></i></div></div>
      <div class="stat-row"><span>Problems solved</span><b>${solved} / ${PROBLEMS.length}</b><div class="meter y"><i style="width:${solved / PROBLEMS.length * 100}%"></i></div></div>
      <div class="stat-row"><span>Best mock OA</span><b>${best != null ? best + " / 3" : "—"}</b><div class="meter b"><i style="width:${best != null ? best / 3 * 100 : 0}%"></i></div></div>
      <div class="lab" style="margin-top:6px">Last 14 days</div>
      <div class="cal">${Array.from({ length: 14 }, (_, i) => `<i class="${days.has(today() - 13 + i) ? "on" : ""}" title="${13 - i} days ago"></i>`).join("")}</div>
    </section>
  `;
});
</script>
</body>
</html>
