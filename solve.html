<body data-page="practice" data-nofoot>
<div id="ws"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const id = location.hash.slice(1) || "matching-weights";
  const p = PROBLEMS.find((x) => x.id === id);
  if (p) document.title = `${p.title} — Patterns`;
  mountSolve(document.getElementById("ws"), id);
  addEventListener("hashchange", () => location.reload());
});
</script>
</body>
